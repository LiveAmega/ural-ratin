<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Уральск Онлайн | SIMPLE LOGIN SYSTEM</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f18;color:#fff;padding:20px}
.card{background:#151b28;padding:16px;border-radius:14px;margin-bottom:14px}
button{padding:8px 12px;border-radius:10px;border:0;cursor:pointer;margin:3px}
input{width:100%;padding:8px;margin:3px 0;border-radius:8px;border:1px solid #222;background:#0e1320;color:#fff}
.hidden{display:none}
.primary{background:#d7a85d}
.danger{background:#ff5c5c}
.green{background:#3ddc97}
.table{width:100%;border-collapse:collapse}
.table td,.table th{border-bottom:1px solid #222;padding:8px}
.small{color:#8c98aa;font-size:12px}
</style>
</head>
<body>

<div class="card">
<h2>⚡ Уральск Онлайн</h2>
<div id="status">Система загружена</div>
<div id="userBox"></div>
<div id="roleBox"></div>
<button onclick="logout()" id="logoutBtn" class="danger hidden">Выйти</button>
</div>

<!-- TOP BUTTONS -->
<div class="card">
<button onclick="openLeaderLogin()">Лидер вход</button>
<button onclick="openLeaderRegister()">Лидер регистрация</button>
<button onclick="openAdminLogin()">Админ вход</button>
</div>

<!-- FORMS -->
<div id="leaderLogin" class="card hidden">
<h3>Лидер вход</h3>
<input id="lEmail" placeholder="Логин" />
<input id="lPass" type="password" placeholder="Пароль" />
<button onclick="leaderLogin()">Войти</button>
</div>

<div id="leaderRegister" class="card hidden">
<h3>Регистрация лидера</h3>
<input id="rEmail" placeholder="Логин" />
<input id="rPass" type="password" placeholder="Пароль" />
<button onclick="leaderRegister()">Создать</button>
</div>

<div id="adminLogin" class="card hidden">
<h3>Админ вход</h3>
<input id="adminPass" type="password" placeholder="Пароль" />
<button onclick="adminLogin()">Войти</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
<div class="card">
<button onclick="show('rating')">📊 Рейтинг</button>
<button onclick="show('hours')">⏱ Часы</button>
<button onclick="show('reasons')">🧾 Причины</button>
<button onclick="show('logs')">📜 Логи</button>
<button id="adminTab" class="hidden" onclick="show('admin')">👑 Админ</button>
</div>

<div id="rating" class="card"><h3>Рейтинг</h3></div>
<div id="hours" class="card hidden"><h3>Часы</h3></div>
<div id="reasons" class="card hidden"><h3>Причины</h3></div>
<div id="logs" class="card hidden"><h3>Логи</h3></div>
<div id="admin" class="card hidden"><h3>Админ</h3></div>
</div>

<script>
const firebaseConfig={
apiKey:"YOUR_API_KEY",
authDomain:"uralskonline.firebaseapp.com",
databaseURL:"https://uralskonline-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"uralskonline",
storageBucket:"uralskonline.firebasestorage.app",
messagingSenderId:"738077138136",
appId:"1:738077138136:web:c68f31b26c44562a9f0bad"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let role="guest";
let currentUser=null;
const ADMIN_PASSWORD="12345";
let leaders=JSON.parse(localStorage.getItem("leaders")||"{}");

function setUI(){
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  userBox.innerText=currentUser;
  roleBox.innerText="Роль: "+role;
}

function logout(){role="guest";currentUser=null;document.getElementById('app').classList.add('hidden');document.getElementById('logoutBtn').classList.add('hidden');}

function openLeaderLogin(){hide();leaderLogin.classList.remove('hidden');}
function openLeaderRegister(){hide();leaderRegister.classList.remove('hidden');}
function openAdminLogin(){hide();adminLogin.classList.remove('hidden');}
function hide(){leaderLogin.classList.add('hidden');leaderRegister.classList.add('hidden');adminLogin.classList.add('hidden');}

function leaderRegister(){leaders[rEmail.value]=rPass.value;localStorage.setItem("leaders",JSON.stringify(leaders));alert("OK");}

function leaderLogin(){if(leaders[lEmail.value]===lPass.value){role="leader";currentUser=lEmail.value;setUI();hide();}else alert("error");}

function adminLogin(){if(adminPass.value===ADMIN_PASSWORD){role="admin";currentUser="ADMIN";setUI();hide();document.getElementById('adminTab').classList.remove('hidden');}else alert("wrong");}

function show(id){['rating','hours','reasons','logs','admin'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
</script>
</body>
</html>
