<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MDT PRO V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    margin:0;
    font-family: Inter, sans-serif;
    background:#0b0f1a;
    color:#e6e6e6;
}

/* LOGIN */
#loginScreen {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.loginBox {
    background:#121a2b;
    padding:20px;
    border-radius:12px;
    width:300px;
}

input {
    width:100%;
    padding:8px;
    margin:5px 0;
    background:#0e1422;
    border:1px solid #333;
    color:white;
    border-radius:6px;
}

button {
    width:100%;
    padding:8px;
    margin-top:8px;
    background:#d7a85d;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:6px;
}

/* HEADER */
header {
    display:flex;
    justify-content:space-between;
    padding:10px;
    background:#111827;
    border-bottom:1px solid #222;
}

/* LAYOUT */
.container {
    display:grid;
    grid-template-columns: 300px 1fr;
    height: calc(100vh - 50px);
}

/* SIDEBAR */
.sidebar {
    padding:10px;
    border-right:1px solid #222;
    overflow:auto;
}

/* MAP */
#map {
    height:100%;
}

/* CARD */
.card {
    background:#121a2b;
    padding:8px;
    margin:5px 0;
    border-left:3px solid #4aa3ff;
    border-radius:6px;
}

/* BADGES */
.red { border-left-color:#ff4d4d; }
.green { border-left-color:#3ddc97; }
.gold { border-left-color:#d7a85d; }

.hidden { display:none; }

small { opacity:0.6; }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="loginBox">
        <h3>🚔 MDT LOGIN</h3>
        <input id="user" placeholder="Логин">
        <input id="pass" type="password" placeholder="Пароль">
        <button onclick="login()">ВОЙТИ</button>
        <small>admin / admin</small>
    </div>
</div>

<header>
    <div>🚔 MDT PRO V2</div>
    <div id="role"></div>
</header>

<div class="container hidden" id="app">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h3>🚨 WANTED</h3>
        <input id="w_name" placeholder="Имя">
        <input id="w_reason" placeholder="Причина">
        <input id="w_level" placeholder="Уровень">
        <button onclick="addWanted()">Добавить</button>
        <div id="wantedBox"></div>

        <h3>📡 DISPATCH</h3>
        <input id="d_msg" placeholder="Сообщение">
        <button onclick="addDispatch()">Отправить</button>
        <div id="dispatchBox"></div>

    </div>

    <!-- MAP -->
    <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= USERS =================
const USERS = {
    "admin": {pass:"admin", role:"ADMIN"},
    "police": {pass:"1234", role:"POLICE"},
    "gov": {pass:"1234", role:"GOV"}
};

let currentUser = null;

// ================= DB =================
let DB = JSON.parse(localStorage.getItem("mdt_v2")) || {
    wanted: [],
    dispatch: [],
    gps: []
};

function save(){
    localStorage.setItem("mdt_v2", JSON.stringify(DB));
}

// ================= LOGIN =================
function login(){
    let u = user.value;
    let p = pass.value;

    if(!USERS[u] || USERS[u].pass !== p){
        alert("Ошибка входа");
        return;
    }

    currentUser = USERS[u];

    loginScreen.style.display = "none";
    app.classList.remove("hidden");

    role.innerText = "ROLE: " + currentUser.role;

    initMap();
    render();
}

// ================= MAP =================
let map;
let markers = [];

function initMap(){
    map = L.map('map').setView([51.5, -0.09], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    map.on("click", e => {
        if(currentUser.role === "POLICE" || currentUser.role === "ADMIN"){
            addGPSMarker(e.latlng.lat, e.latlng.lng);
        }
    });

    loadMarkers();
}

function addGPSMarker(lat,lng){
    DB.gps.push({lat,lng,time:new Date().toLocaleString()});
    save();
    loadMarkers();
}

function loadMarkers(){
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    DB.gps.forEach(g => {
        let m = L.marker([g.lat,g.lng]).addTo(map)
            .bindPopup("🚨 GPS TARGET<br>"+g.time);
        markers.push(m);
    });
}

// ================= WANTED =================
function addWanted(){
    DB.wanted.push({
        name:w_name.value,
        reason:w_reason.value,
        level:w_level.value,
        time:new Date().toLocaleString()
    });
    save();
    render();
}

// ================= DISPATCH =================
function addDispatch(){
    DB.dispatch.unshift({
        msg:d_msg.value,
        time:new Date().toLocaleString()
    });
    save();
    render();
}

// ================= RENDER =================
function render(){

    wantedBox.innerHTML = DB.wanted.map(w => `
        <div class="card red">
            🚨 <b>${w.name}</b><br>
            Lvl ${w.level}<br>
            ${w.reason}<br>
            <small>${w.time}</small>
        </div>
    `).join("");

    dispatchBox.innerHTML = DB.dispatch.map(d => `
        <div class="card green">
            📡 ${d.msg}<br>
            <small>${d.time}</small>
        </div>
    `).join("");
}

</script>

</body>
</html>
