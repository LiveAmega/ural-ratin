<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Уральск Онлайн | Firebase PRO UPGRADE</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#0b0f18;
  --card:#151b28;
  --text:#fff;
  --accent:#d7a85d;
  --red:#ff5c5c;
  --green:#3ddc97;
  --muted:#8c98aa;
}
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:var(--bg);color:var(--text);padding:20px}
.container{max-width:1400px;margin:auto}
.card{background:var(--card);padding:16px;border-radius:14px;margin-bottom:14px}
button{cursor:pointer;border:0;padding:8px 12px;border-radius:10px;margin:3px}
input{padding:8px;border-radius:8px;border:1px solid #222;background:#0e1320;color:#fff;width:100%;margin:3px 0}
.hidden{display:none}
.nav button{margin-right:6px}
.primary{background:var(--accent)}
.danger{background:var(--red)}
.green{background:var(--green)}
.table{width:100%;border-collapse:collapse}
.table td,.table th{border-bottom:1px solid #222;padding:8px}
.small{color:var(--muted);font-size:12px}
</style>
</head>
<body>

<div class="container">

<div class="card">
<h2>⚡ Уральск Онлайн (PRO UPGRADE Firebase)</h2>
<div id="userBox"></div>
<button id="logoutBtn" class="danger hidden" onclick="logout()">Выйти</button>
</div>

<div id="auth" class="card">
<h3>Вход</h3>
<input id="email" placeholder="Email" />
<input id="pass" type="password" placeholder="Пароль" />
<button class="primary" onclick="login()">Войти</button>
<button onclick="register()">Регистрация</button>
</div>

<div id="app" class="hidden">

<div class="card nav">
<button onclick="show('rating')">📊 Рейтинг</button>
<button onclick="show('hours')">⏱ Часы</button>
<button onclick="show('reasons')">🧾 Причины</button>
<button onclick="show('logs')">📜 Логи</button>
<button onclick="show('admin')" id="adminTab" class="hidden">👑 Админ</button>
</div>

<div id="rating" class="card">
<h3>Рейтинг фракций</h3>
<input id="factionName" placeholder="Фракция" />
<input id="factionPoints" placeholder="Баллы" />
<button class="green" onclick="setRating()">Обновить рейтинг</button>
<table class="table" id="ratingTable"></table>
</div>

<div id="hours" class="card hidden">
<h3>Лидерские часы</h3>
<input id="hourFaction" placeholder="Фракция" />
<input id="hourValue" placeholder="Часы (+/-)" />
<button class="green" onclick="updateHours()">Изменить часы</button>
<table class="table" id="hoursTable"></table>
</div>

<div id="reasons" class="card hidden">
<h3>Причины</h3>
<input id="reasonUser" placeholder="Игрок" />
<input id="reasonText" placeholder="Причина" />
<button class="green" onclick="addReason()">Добавить</button>
<table class="table" id="reasonsTable"></table>
</div>

<div id="logs" class="card hidden">
<h3>Логи действий</h3>
<pre id="logsBox"></pre>
</div>

<div id="admin" class="card hidden">
<h3>Админ панель (RAW)</h3>
<pre id="adminBox"></pre>
</div>

</div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDz3tFFVILAnAP3u_FFnxejFoDIuLDoQP4",
  authDomain: "uralskonline.firebaseapp.com",
  databaseURL: "https://uralskonline-default-rtdb.firebaseio.com",
  projectId: "uralskonline",
  storageBucket: "uralskonline.firebasestorage.app",
  messagingSenderId: "738077138136",
  appId: "1:738077138136:web:c68f31b26c44562a9f0bad"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const ADMIN_EMAIL = "admin@gmail.com";
let role="user";
let cache={};

function logAction(text){
  db.ref('uralsk/logs').push({text,time:Date.now()});
}

function login(){auth.signInWithEmailAndPassword(email.value,pass.value).catch(e=>alert(e.message));}
function register(){auth.createUserWithEmailAndPassword(email.value,pass.value).catch(e=>alert(e.message));}
function logout(){auth.signOut();}

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    document.getElementById('userBox').innerText=user.email;

    role=(user.email===ADMIN_EMAIL)?"admin":"user";
    if(role==='admin') document.getElementById('adminTab').classList.remove('hidden');

    listenDB();
  } else {
    document.getElementById('auth').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('logoutBtn').classList.add('hidden');
  }
});

function show(id){['rating','hours','reasons','logs','admin'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='admin')loadAdmin();}

function listenDB(){
  db.ref('uralsk').on('value',snap=>{
    cache=snap.val()||{};
    renderAll();
  });
}

function renderAll(){renderRating();renderHours();renderReasons();renderLogs();}

function renderRating(){
  const t=document.getElementById('ratingTable');
  t.innerHTML='<tr><th>Фракция</th><th>Баллы</th></tr>';
  const r=cache.rating||{};
  Object.keys(r).forEach(k=>t.innerHTML+=`<tr><td>${k}</td><td>${r[k]}</td></tr>`);
}

function renderHours(){
  const t=document.getElementById('hoursTable');
  t.innerHTML='<tr><th>Фракция</th><th>Часы</th></tr>';
  const h=cache.hours||{};
  Object.keys(h).forEach(k=>t.innerHTML+=`<tr><td>${k}</td><td>${h[k]}</td></tr>`);
}

function renderReasons(){
  const t=document.getElementById('reasonsTable');
  t.innerHTML='<tr><th>Игрок</th><th>Причина</th></tr>';
  const r=cache.reasons||{};
  Object.keys(r).forEach(k=>t.innerHTML+=`<tr><td>${k}</td><td>${r[k]}</td></tr>`);
}

function renderLogs(){
  const logs=cache.logs||{};
  document.getElementById('logsBox').innerText=JSON.stringify(logs,null,2);
}

// ACTIONS
function setRating(){db.ref('uralsk/rating/'+factionName.value).set(Number(factionPoints.value));logAction('rating '+factionName.value);}
function updateHours(){db.ref('uralsk/hours/'+hourFaction.value).transaction(v=>(v||0)+Number(hourValue.value));logAction('hours '+hourFaction.value);}
function addReason(){db.ref('uralsk/reasons/'+reasonUser.value).set(reasonText.value);logAction('reason '+reasonUser.value);}

function loadAdmin(){if(role!=='admin')return;db.ref('uralsk').once('value',s=>{document.getElementById('adminBox').innerText=JSON.stringify(s.val(),null,2);});}

</script>
</body>
</html>
